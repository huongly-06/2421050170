<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <style>
        body{
            background-color: #2f2c38;
            color: white;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="danh-muc">
            <ul class="danh-sach-muc">
                <img class="logo" src="./anh/netflix.svg">
                <li class="muc dang-chon"><a class="lien-ket-muc" href="">Trang chủ</a></li>
                <li class="muc"><a class="lien-ket-muc" href="">Nhân vật</a></li>
                <li class="muc"><a class="lien-ket-muc" href="">Series</a></li>
                <li class="muc"><a class="lien-ket-muc" href="">Phim</a></li>
                <li class="muc"><a class="lien-ket-muc" href="">Mới & Phổ biến</a></li>
                <li class="muc"><a class="lien-ket-muc" href="">Netflix của tôi</a></li>
                <li class="muc"><a class="lien-ket-muc" href="">Duyệt tìm theo ngôn ngữ</a></li>
            </ul>
        </nav>
        <div class="chuc-nang">
            <div class="tim-kiem"></div>
            <div class="thong-tin">
                <img class="avata" src="./anh/treem.jpg" alt="">
            </div>
        </div>
    </header>

    <main>
        <div class="banner">
            <img class="banner-anh" src="./anh/banner.jpg" alt="">
        </div>
        <div class="danh-sach-the-loai">
            <div class="the-loai">
                <div class="ten-the-loai">
                    <h2>Có thể bạn chưa xem</h2>
                </div>
                <div class="danh-sach-phim">
                    <div class="phim">
                        <img src="./anh/phim1.jpg" class="phim-poster"></img>
                        <img src="./anh/phim2.jpg" class="phim-poster"></img>
                        <img src="./anh/phim3.jpg" class="phim-poster"></img>
                        <img src="./anh/phim4.jpg" class="phim-poster"></img>
                    </div>
                </div>

                <div class="ten-the-loai">
                    <h2>Phim hài hước</h2>
                </div>
                <div class="danh-sach-phim">
                    <div class="phim">
                        <img src="./anh/haihuoc1.jpg" class="phim-poster"></img>
                        <img src="./anh/haihuoc2.jpg" class="phim-poster"></img>
                        <img src="./anh/haihuoc3.jpg" class="phim-poster"></img>
                        <img src="./anh/haihuoc4.jpg" class="phim-poster"></img>
                    </div>
                </div>

                <div class="ten-the-loai">
                    <h2>Hoạt hình</h2>
                </div>
                <div class="danh-sach-phim">
                    <div class="phim">
                        <img src="./anh/hoathinh1.jpg" class="phim-poster"></img>
                        <img src="./anh/hoathinh2.jpg" class="phim-poster"></img>
                        <img src="./anh/hoathinh3.jpg" class="phim-poster"></img>
                        <img src="./anh/hoathinh4.jpg" class="phim-poster"></img>
                    </div>
                </div>

                <div class="ten-the-loai">
                    <h2>Mọi người đang xem</h2>
                </div>
                <div class="danh-sach-phim">
                    <div class="phim">
                        <img src="./anh/a1.jpg" class="phim-poster"></img>
                        <img src="./anh/a2.jpg" class="phim-poster"></img>
                        <img src="./anh/a3.jpg" class="phim-poster"></img>
                        <img src="./anh/a4.jpg" class="phim-poster"></img>
                    </div>
                </div>

                <div class="ten-the-loai">
                    <h2>Top 10 phim Việt Nam hôm nay</h2>
                </div>
                <div class="danh-sach-phim">
                    <div class="phim">
                        <img src="./anh/b1.jpg" class="phim-poster"></img>
                        <img src="./anh/b2.jpg" class="phim-poster"></img>
                        <img src="./anh/b3.jpg" class="phim-poster"></img>
                        <img src="./anh/b4.jpg" class="phim-poster"></img>
                    </div>
                </div>

                <div class="ten-the-loai">
                    <h2>Giáo dục và giải trí</h2>
                </div>
                <div class="danh-sach-phim">
                    <div class="phim">
                        <img src="./anh/giaitri1.jpg" class="phim-poster"></img>
                        <img src="./anh/giaitri2.jpg" class="phim-poster"></img>
                        <img src="./anh/giaitri3.jpg" class="phim-poster"></img>
                        <img src="./anh/giaitri4.jpg" class="phim-poster"></img>
                    </div>
                </div>

                <div class="ten-the-loai">
                    <h2>Nhân vật</h2>
                </div>
                <div class="danh-sach-nhan-vat">
                    <div class="phim">
                        <img src="./anh/c1.jpg" class="nhan-vat"></img>
                        <img src="./anh/c2.jpg" class="nhan-vat"></img>
                        <img src="./anh/c3.jpg" class="nhan-vat"></img>
                        <img src="./anh/c4.jpg" class="nhan-vat"></img>
                        <img src="./anh/c5.jpg" class="nhan-vat"></img>
                        <img src="./anh/c6.jpg" class="nhan-vat"></img>
                        <img src="./anh/c7.jpg" class="nhan-vat"></img>
                    </div>
                </div>

            </div>
        </div>
    </main>
</body>
</html>
