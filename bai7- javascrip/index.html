<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript - 1</title>
</head>
<body>
    <!-- Internal JavaScript -->
    <script>
        // In ra màn hình
        document.writeln('Hello world <br>');

        // khai báo biến
        var name= 'Huong Ly <br>';
        document.writeln(name);

        // // Thay doi gtri cua bien
        // name='Hong <br>';
        // document.writeln(name);

        var year = 2026;
        document.writeln(year);

        //Phép toán
        var soThuNhat = 10;
        var soThuHai = 5;
        var ketQua = 0;
        // Cộng +
        document.writeln(' <br> Ket qua soThu1 + soThu2 la:')
        ketQua = soThuNhat + soThuHai;
        document.writeln(ketQua);

        // Tru -
        document.writeln(' <br> Ket qua soThu1 - soThu2 la:')
        ketQua = soThuNhat - soThuHai;
        document.writeln(ketQua);

        // Nhan 8
        document.writeln(' <br> Ket qua soThu1 * soThu2 la:')
        ketQua = soThuNhat * soThuHai;
        document.writeln(ketQua);

        // Chia /
        document.writeln(' <br> Ket qua soThu1 / soThu2 la:')
        ketQua = soThuNhat / soThuHai;
        document.writeln(ketQua);

        // Chia lay du %
        document.writeln(' <br> Ket qua soThu1 % soThu2 la:')
        ketQua = soThuNhat % soThuHai;
        document.writeln(ketQua);

        // //++
        // document.writeln('<br>');
        // document.writeln(soThuNhat++);
        // document.writeln('<br>');
        // document.writeln(soThuNhat);

        // //--
        // document.writeln('<br>');
        // document.writeln(--soThuHai);

        //+=
        document.writeln('<br>');
        soThuNhat += soThuHai;
        document.writeln(soThuNhat);

        //-=
        document.writeln('<br>');
        soThuNhat -= soThuHai;
        document.writeln(soThuNhat);

        var ho = 'Do';
        document.writeln( "<br>" + ho+ " "+name);
        // Kiem tra do dai chuoi
        document.writeln('Do dai cua chuoi la: ');
        document.writeln(ho.length);

        //Kiem tra kieu cua bien
        document.writeln('<br>');
        document.writeln('Kieu DL cua bien:')
        document.writeln(typeof(ho));
        document.writeln('<br>');

        //Tim vi tri xhien trong chuoi
        var hoVaTen = 'Do Huong Ly';
        document.writeln(hoVaTen.indexOf('Huong'));
        document.writeln('<br>');
        document.writeln(hoVaTen.includes(hoVaTen));

        //Tim kiem chuoi co bat dau = tu
        document.writeln('<br>');
        document.writeln(hoVaTen.startsWith('Do'));

        //Replace
        document.writeln('<br>');
        document.writeln(hoVaTen.replace('Do', 'Nguyen'))

        //Upper, Lower
        document.writeln('<br>');
        document.writeln(hoVaTen.toLowerCase())

        document.writeln('<br>');
        document.writeln(hoVaTen.toUpperCase())

        //Date
        var homNay = new Date ();
        document.writeln('<br>');
        document.writeln(homNay);

        var Ngay = new Date("8/6/2025");
        document.writeln('<br>');
        document.writeln(Ngay);

        var namNay = homNay.getFullYear();
        document.writeln('<br>');
        document.writeln(namNay);

        var thangNay = homNay.getMonth() + 1;
        document.writeln('<br>');
        document.writeln(thangNay);

        var ngayHomNay = homNay.getDate()
        document.writeln('<br>');
        document.writeln(ngayHomNay);

        var thuNay = homNay.getDay() + 1;
        document.writeln('<br>');
        document.writeln(thuNay);

        document.writeln('<br>');
        document.writeln('Hôm nay là thứ ' + thuNay + '  Ngày ' + ngayHomNay + '  Tháng ' + thangNay + '  Năm ' + namNay)

        var mangSo = [1, 2, 3, 4, 5];
        document.writeln('<br>');
        document.writeln(mangSo[2]);
        document.writeln('<br>');
        document.writeln('Độ dài của mảng: ' ,mangSo.length);

        var mangChu = ['Hly', 'Hong', 'Ngan']
        document.writeln('<br>');
        document.writeln(mangChu[2])

        document.writeln('<br>');
        var mang = [1, 2, 3, 4, 5, 'Hly', 'Hong', 'Ngan']
        document.writeln(mang[5])

        var d = mang.concat(mangSo, mangChu);
        document.writeln('<br>');
        document.writeln(d);

        document.writeln('<br>');
        document.writeln(d.join('-'));

        document.writeln('<br>');
        document.writeln('Phần tử cuối cùng trong mảng: ', d.pop());

        //Them ptu
        d.push('Ly');
        document.writeln('<br>');
        document.writeln(d);

        //Dao nguoc ptu trong mang
        document.writeln('<br>');
        document.writeln(mangSo.reverse());

        //Object
        var thongTinSinhVien = {
            ten: 'Do Huong Ly',
            namSinh: 2006,
            queQuan: {
                thanhPho: 'Ha Noi',
                xa: 'Phuc Thinh'
            }
        };
        document.writeln('<br>');
        document.writeln(thongTinSinhVien.ten);
        document.writeln('<br>');
        document.writeln(thongTinSinhVien.queQuan.thanhPho);

        tuoi = namNay - thongTinSinhVien.namSinh;
        document.writeln('<br>');
        document.writeln(tuoi);
        thongTinSinhVien.tuoi = tuoi;

        //console.log(thongTinSinhVien);

        //boolean: true: nam, false: nu
        thongTinSinhVien.gioiTinh = true;

       var danhSach = [
            {
                ten: 'Do Huong Ly',
                namSinh: 2006,
                queQuan: {
                    thanhPho: 'Ha Noi',
                    xa: 'Phuc Thinh'
                }
            }, 
            {
                ten: 'Minh Hong',
                namSinh: 2006,
                queQuan: {
                    thanhPho: 'Ha Nam',
                    xa: 'Phuc Thinh'
                }
            }
        ];

        var so1 = 5;
        var so2 = 10;
        document.writeln('<br>');
        document.writeln( so1 == so2)

        document.writeln('<br>');
        if(thuNay > 6){
            document.writeln('Cuoi tuan');
        }else if(thuNay == 6){
            document.writeln('Sap dc nghi');
        }else{
            document.writeln('Di hoc');
        }

        document.writeln('<br>');
        var so = 7;
        if( so%2 ==0){
            document.writeln(so, ' la so chan')
        }
        document.writeln(so, ' la so le')

    </script>

    <script src="script.js"></script>
</body>
