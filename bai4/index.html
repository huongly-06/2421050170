<html> 
    <head>
        <title> bai 4</title>
    </head>
    <body>
        <h1> Form tạo thông tin </h1>
            <form>
                <div>
                    <!-- input nếu ko truyền type thì mặc định là text -->
                    <p><b>Họ và tên : </b></p>
                    <input type="text" name="fullName"><br>
                </div>

                <div>
                    <p><b>Giới thiệu bản thân:</b></p>
                    <!-- textarea là thẻ dùng để nhập nhiều dòng, có thể truyền thuộc tính rows và cols để điều chỉnh kích thước của textarea -->
                    <textarea name="gioiThieu" ></textarea>
                </div>

                <div>
                    <p><b>Email:</b></p>
                    <input type="email" name="email"><br>
                </div>

                <div>
                    <p><b>Số điện thoại:</b></p>
                    <input type="tel" name="soDienThoai"
                    type="tel"
                    placeholder="Dạng số 123"
                    required
                    pattern="([0]{1}([3,6,8,9]{1})([0-9]{8}))"><br>
                    <!-- placeholder là gợi ý cho người dùng nhập đúng định dạng
                    required là bắt buộc phải nhập
                    pattern là quy tắc để kiểm tra dữ liệu nhập vào, nếu không đúng thì sẽ báo lỗi -->
                </div>

                <div>
                    <!-- chỉ chọn được 1 lựa chọn trong 1 nhóm radio, nếu muốn chọn nhiều thì dùng checkbox -->
                    <p><b>Giới tính:</b></p>
                    <input type="radio" name="gender" value="male">Nam<br> 
                    <input type="radio" name="gender" value="female">Nữ<br>
                </div>

                <div>
                    <!-- checkbox là thẻ dùng để chọn nhiều lựa chọn, nếu muốn chỉ chọn 1 thì dùng radio -->
                    <p><b>Sở thích:</b></p>
                    Game: <input type="checkbox" name="hobbies" value="game"><br>
                    Music: <input type="checkbox" name="hobbies" value="music"><br>
                    Sports: <input type="checkbox" name="hobbies" value="sports"><br>
                </div>

                <div>
                    <!-- list là thẻ dùng để tạo danh sách các lựa chọn, người dùng có thể chọn 1 trong các lựa chọn đó  
                    tên id của list phải trùng với thuộc tính list của input -->
                    <p><b>Trình duyệt web hay sử dụng:</b></p>
                        <input list="browsers" name="trinhDuyet">
                        <datalist id="browsers">
                            <option value="Chrome">
                            <option value="Firefox">
                            <option value="Safari">
                            <option value="Edge">
                        </datalist>

                        
                        <select name="browsers">
                            <option value="Chrome">Chrome</option>
                            <option value="Firefox">Firefox</option>
                            <option value="Safari">Safari</option>
                            <option value="Edge">Edge</option>
                            <option value="Opera">Opera</option>    
                        </select>
                </div>

                <div>
                    0 <input type="range" id="a" value="50"> 100
                </div>

                <div>
                    <!-- submit dung để gửi dữ liệu đi, reset dùng để xóa dữ liệu đã nhập
                    button là thẻ dùng để tạo nút bấm, có thể dùng để thực hiện các hành động khác nhau, không chỉ gửi dữ liệu đi -->
                    <br>
                    <input type="submit">
                    <button>click</button>
                    <input type="reset">
                </div>

                <iframe width="560" height="315"
                src="https://www.youtube.com/embed/OPCaP_kNFmM?si=2y9k-MppMGVH-sjh" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" 
                allowfullscreen></iframe>

            </form>

            <MARQUEE>     
                Đỗ Hương Ly  
                <img src="../anh/hly.jpg" width ="200" height ="100"> 
            </MARQUEE>
    </body> 
</html>
